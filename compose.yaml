x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    build:
      context: .
      target: caddy
    image: owlctf-caddy:${OWLCTF_IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      CTF_HOST: ${CTF_HOST:?Set CTF_HOST to the public domain}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
      backend:
        ipv4_address: ${CADDY_PROXY_IP:-172.30.0.2}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    cpus: ${CADDY_CPUS:-0.50}
    mem_limit: ${CADDY_MEMORY_LIMIT:-128m}
    pids_limit: 128
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 3s
      retries: 3
    logging: *default-logging

  web:
    build:
      context: .
      target: runtime
    image: owlctf-web:${OWLCTF_IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__MariaDb: Server=mariadb;Port=3306;Database=owlctf;User ID=owlctf;Password=${DB_PASSWORD:?Set DB_PASSWORD};Pooling=true;MinimumPoolSize=0;MaximumPoolSize=${WEB_DB_POOL_SIZE:-40};ConnectionTimeout=10;DefaultCommandTimeout=15
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      Discord__ClientId: ${DISCORD_CLIENT_ID:?Set DISCORD_CLIENT_ID}
      Discord__ClientSecret: ${DISCORD_CLIENT_SECRET:?Set DISCORD_CLIENT_SECRET}
      Security__FlagPepper: ${FLAG_PEPPER:?Set FLAG_PEPPER}
      Database__ApplyEfMigrationsOnStartup: ${APPLY_DATABASE_MIGRATIONS:-true}
      Storage__RootPath: /app/data/challenge-files
      Storage__DataProtectionKeysPath: /app/data/keys
      ReverseProxy__KnownProxy: ${CADDY_PROXY_IP:-172.30.0.2}
      AllowedHosts: "${CTF_HOST:?Set CTF_HOST to the public domain};localhost;127.0.0.1;web"
      DOTNET_EnableDiagnostics: "0"
    expose:
      - "8080"
    volumes:
      - app-data:/app/data
      - uploads-data:/app/wwwroot/uploads
    networks:
      - backend
      - egress
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: ${WEB_CPUS:-1.00}
    mem_limit: ${WEB_MEMORY_LIMIT:-768m}
    pids_limit: 256
    stop_grace_period: 45s
    logging: *default-logging

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: owlctf
      MARIADB_USER: owlctf
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-name-resolve
      - --max-connections=${DB_MAX_CONNECTIONS:-160}
      - --innodb-buffer-pool-size=${DB_BUFFER_POOL_SIZE:-256M}
      - --innodb-flush-log-at-trx-commit=1
      - --thread-cache-size=32
    expose:
      - "3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - backend
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cpus: ${DB_CPUS:-1.50}
    mem_limit: ${DB_MEMORY_LIMIT:-1g}
    pids_limit: 512
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 20
    logging: *default-logging

  redis:
    image: redis:8.10.1-alpine
    restart: unless-stopped
    user: redis
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${REDIS_MAX_MEMORY:-64mb}
      - --maxmemory-policy
      - allkeys-lru
    expose:
      - "6379"
    networks:
      - backend
    read_only: true
    tmpfs:
      - /data:rw,noexec,nosuid,size=64m,mode=1777
      - /tmp:rw,noexec,nosuid,size=8m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: ${REDIS_CPUS:-0.25}
    mem_limit: ${REDIS_MEMORY_LIMIT:-96m}
    pids_limit: 64
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging

networks:
  edge:
  egress:
  backend:
    internal: true
    ipam:
      config:
        - subnet: ${BACKEND_SUBNET:-172.30.0.0/24}

volumes:
  mariadb-data:
  app-data:
  uploads-data:
  caddy-data:
  caddy-config:
